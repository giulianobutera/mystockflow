<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <title>MyStockFlow</title>
</head>
<body>
    <header>
        <h1>¡Bienvenido a MyStockFlow!</h1>
        <p>Gestioná el stock de lo que quieras, de manera simple y con la mejor visualización posible.</p>
    </header>
    <main>
        <!-- Acciones -->
        <section>
            <div class="row">
                <div class="col-12 d-flex">
                    <button type="button" class="btn btn-primary mx-3" data-bs-toggle="modal" data-bs-target="#modalNuevoStock">
                        <i class="bi bi-plus-lg icon-margin-right"></i>Nuevo stock
                    </button>
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" id="botonNuevoStockPlantilla" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-plus-lg icon-margin-right"></i>Nuevo stock desde plantilla
                        </button>
                        <ul class="dropdown-menu" id="dropdownPlantillas">
                        </ul>
                    </div>
                    <!-- Modal para agregar nuevo stock -->
                    <div class="modal fade" id="modalNuevoStock" tabindex="-1" aria-labelledby="modalNuevoStockLabel" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-scrollable modal-lg">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1 class="modal-title fs-5" id="modalNuevoStockLabel">Agregar nuevo stock</h1>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <form id="formularioNuevoStock">
                                        <div class="container-fluid">
                                            <!-- Radios categoría/item -->
                                            <div class="row mb-3">
                                                <div class="col-12">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" name="tipoStock" id="radioCategoria" value="categoria" checked>
                                                        <label class="form-check-label" for="radioCategoria">
                                                            Categoría
                                                            <i class="bi bi-folder-fill" title="Categoría"></i>
                                                        </label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" name="tipoStock" id="radioItemSimple" value="itemSimple">
                                                        <label class="form-check-label" for="radioItemSimple">Ítem simple</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- SECCION CATEGORÍA -->
                                            <div id="seccionCategoria">
                                                <!-- Nombre de la categoría -->
                                                <div class="row mb-3">
                                                    <div class="col-12">
                                                        <label for="nombreCategoria" class="form-label">Nombre de la categoría</label>
                                                        <input type="text" class="form-control" id="nombreCategoria" placeholder="Ingrese el nombre de la categoría" required>
                                                    </div>
                                                </div>
                                                <!-- Descripción de la categoría -->
                                                <div class="row mb-3">
                                                    <div class="col-12">
                                                        <label for="descripcionCategoria" class="form-label">Descripción de la categoría</label>
                                                        <input type="text" class="form-control" id="descripcionCategoria" placeholder="Ingrese descripción de la categoría (opcional)">
                                                    </div>
                                                </div>
                                                <!-- Ítems de la categoría -->
                                                <hr>
                                                <div class="row">
                                                    <h5 class="mb-2">Ítems de la categoría:</h5>
                                                </div>
                                                <div id="itemsCategoria">
                                                </div>
                                                <div class="row mt-3">
                                                    <div class="col-12">
                                                        <button type="button" class="btn btn-primary" id="agregarOtroItem">
                                                            <i class="bi bi-plus-lg icon-margin-right"></i>Agregar otro ítem
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- SECCIÓN ÍTEM SIMPLE -->
                                            <div id="seccionItemSimple" class="d-none">
                                                <!-- Nombre del ítem simple -->
                                                <div class="row mb-3">
                                                    <div class="col-12">
                                                        <div class="form-group">
                                                            <label for="nombreItemSimple" class="form-label">Nombre del ítem simple</label>
                                                            <input type="text" class="form-control" id="nombreItemSimple" placeholder="Ingrese el nombre del ítem simple">
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- Descripción del ítem simple -->
                                                <div class="row mb-3">
                                                    <div class="col-12">
                                                        <div class="form-group">
                                                            <label for="descripcionItemSimple" class="form-label">Descripción del ítem simple</label>
                                                            <input type="text" class="form-control" id="descripcionItemSimple" placeholder="Ingrese descripción del ítem simple (opcional)">
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- Cantidad de stock del ítem simple -->
                                                <div class="row mb-3">
                                                    <div class="col-12">
                                                        <div class="form-group">
                                                            <label for="cantidadItemSimple" class="form-label">Stock</label>
                                                            <input type="number" class="form-control" id="cantidadItemSimple" placeholder="Ingrese la cantidad de stock">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary" form="formularioNuevoStock">Guardar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Stock -->
        <section>
            <h4 class="mb-3">Stock de categorías e ítems existentes</h4>
            <!-- Cards de categorías e ítems -->
            <div class="container custom-container">
                <div class="row" id="cardsStock">
                </div>
            </div>
            <!-- Empty State -->
            <div class="row" id="emptyStateStock">
                <div class="col-12">
                    <div class="empty-state">
                        <i class="bi bi-info-circle empty-state-icon text-info" aria-hidden="true"></i>
                        <p>Aún no se agregaron categorías o ítems</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
